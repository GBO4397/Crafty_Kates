<!-- Blog Archive template -->
<main id="main-content"><section data-etch-element="section" class="bg--ultra-dark text--light"><div data-etch-element="container" class="ck-section-intro"><p class="ck-eyebrow">Community voices</p><h1 class="ck-display">Stories</h1><p>Creativity, cars, and the people who make our community special.</p></div></section><section data-etch-element="section"><div data-etch-element="container" class="grid--auto-2 grid-gap">{#loop ckStories as story}<article class="ck-card"><etch:img class="ck-card__media" mediaId="{story.featured_image_id}" useSrcSet="true" /><div class="ck-card__body"><p class="ck-eyebrow">{story.date}</p><h2 class="ck-display">{story.title}</h2><p>{story.excerpt}</p><a href="{story.permalink.relative}">Read {story.title}</a></div></article>{/loop}</div></section></main>

<!-- Blog Single template -->
<main id="main-content"><article><header data-etch-element="section" class="bg--ultra-dark text--light"><div data-etch-element="container" class="ck-section-intro"><p class="ck-eyebrow">{this.date} · {this.author.name}</p><h1 class="ck-display">{this.title}</h1><p>{this.excerpt}</p></div></header><section data-etch-element="section"><div data-etch-element="container" class="ck-legal"><etch:img mediaId="{this.featured_image_id}" useSrcSet="true" /><etch:html content={this.content} unsafe="false" /></div></section></article></main>
