<main id="main-content">
  <article>
    <header class="ck-hero bg--ultra-dark text--light"><etch:img class="ck-hero__media" mediaId="{this.featured_image_id}" useSrcSet="true" alt="" /><div class="ck-hero__shade"></div><div data-etch-element="container" class="ck-hero__content"><p class="ck-eyebrow">{this.category}</p><h1 class="ck-display">{this.title}</h1><p>{this.event_date} · {this.location}</p></div></header>
    <section data-etch-element="section"><div data-etch-element="container" class="ck-split"><div><etch:html content={this.content} unsafe="false" /></div><aside class="ck-card ck-card__body"><h2 class="ck-display">Event details</h2><p><strong>Date</strong><br>{this.event_date}</p><p><strong>Time</strong><br>{this.event_time_start}–{this.event_time_end}</p><p><strong>Location</strong><br>{this.location}<br>{this.address}</p><a class="btn--primary" href="{this.ticket_url}">Tickets / information</a></aside></div></section>
  </article>
</main>
