<main id="main-content"><article><header data-etch-element="section" class="bg--ultra-dark text--light"><div data-etch-element="container" class="ck-section-intro"><p class="ck-eyebrow">Photo gallery</p><h1 class="ck-display">{this.title}</h1><p>Photography by {this.photographer_name}</p><etch:html content={this.content} unsafe="false" /></div></header><section data-etch-element="section"><div data-etch-element="container" class="ck-gallery-grid grid--auto-3 grid-gap">{#loop ckGalleryPhotos as photo}<figure><etch:img mediaId="{photo.featured_image_id}" useSrcSet="true" /><figcaption>{photo.excerpt}</figcaption></figure>{/loop}</div></section></article></main>
<!-- In Etch, convert the grid to the native Gallery component and attach the native Lightbox component. Keep ckGalleryPhotos as its loop source. -->
